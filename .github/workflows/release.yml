name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This job runs with contents:write and a cross-repository PAT in its
      # environment, so its actions are pinned to commit SHAs rather than
      # mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # A tag on a broken commit must not publish a release, a cask and three
      # package formats without a single test having run.
      - name: Test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the Homebrew cask writes to Resetnak/homebrew-tap, which
          # the workflow's own GITHUB_TOKEN cannot reach: it is scoped to this
          # repository. A fine-grained PAT limited to the tap fills the gap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # GoReleaser v2 only allows plain {{ .Env.X }} in homebrew_casks
          # fields, so we compute the skip flag here instead of using if/else
          # in the template.
          SKIP_HOMEBREW_UPLOAD: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN == '' }}
