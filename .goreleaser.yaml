version: 2

project_name: cooldeck

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cooldeck
    binary: cooldeck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/resetnak/cooldeck/internal/version.Version={{.Version}}
      - -X github.com/resetnak/cooldeck/internal/version.Commit={{.ShortCommit}}
      - -X github.com/resetnak/cooldeck/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
