version: 2

project_name: cooldeck

before:
  hooks:
    # verify, not tidy: a release must build exactly the tagged tree. tidy can
    # either mutate go.mod (releasing source that differs from the tag) or die
    # on the resulting dirty state. CI keeps the module tidy on PRs instead.
    - go mod verify

builds:
  - main: ./cmd/cooldeck
    binary: cooldeck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/resetnak/cooldeck/internal/version.Version={{.Version}}
      - -X github.com/resetnak/cooldeck/internal/version.Commit={{.ShortCommit}}
      - -X github.com/resetnak/cooldeck/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto

# Homebrew: a cask rather than a formula, because what ships here is a
# pre-built binary, not something Homebrew compiles. Pushing to the tap needs a
# token that can write to another repository, which the workflow's own
# GITHUB_TOKEN cannot - hence HOMEBREW_TAP_GITHUB_TOKEN.
homebrew_casks:
  - name: cooldeck
    # A missing or expired tap token skips the cask push instead of failing the
    # whole release - archives, checksums and packages still ship. The actual
    # true/false value is computed in the workflow and injected as an env var,
    # because GoReleaser v2 only allows plain {{ .Env.X }} here.
    skip_upload: '{{ .Env.SKIP_HOMEBREW_UPLOAD }}'
    repository:
      owner: Resetnak
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: https://github.com/Resetnak/cooldeck
    description: Keyboard-first terminal dashboard for Coolify
    # Strip the quarantine flag Gatekeeper adds to downloaded archives, so the
    # first run does not die with "cannot be opened because the developer
    # cannot be verified".
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cooldeck"]
          end

# Linux packages, built from the same binaries as the archives. A server
# operator who reaches for apt or dnf should not have to unpack a tarball and
# pick a directory to put it in.
nfpms:
  - id: packages
    package_name: cooldeck
    vendor: Resetnak
    homepage: https://github.com/Resetnak/cooldeck
    maintainer: Alexandr Resetnak <mail@resetnak.cz>
    description: |-
      Keyboard-first terminal dashboard for Coolify.
      Deployments, logs, restarts and instance switching from the terminal.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/cooldeck/LICENSE
      - src: README.md
        dst: /usr/share/doc/cooldeck/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/cooldeck/CHANGELOG.md
