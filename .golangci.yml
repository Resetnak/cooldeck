# golangci-lint v2 - focused gate, not a style police.
#
# Misspell is omitted: the codebase uses British English (colour, behaviour)
# and Coolify status strings like CANCELLED.
#
# Gosec is omitted deliberately - do not re-add it without reading this. All 14
# findings it produced were false positives: seeded math/rand in the demo
# generator and the skeleton animation (determinism is the point, not secrecy),
# G304 on config/log paths the user themselves configured, G204 on the
# documented `token_source = "command"` feature and on platform.OpenURL (which
# already validates scheme and host and passes argv without a shell). Silencing
# those needs ~7 exclusions or #nosec annotations, and a codebase trained to
# sprinkle #nosec is worse off than one without the linter. govulncheck in
# .github/workflows/security.yml covers real dependency CVEs.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - unused
    - govet
    - staticcheck
    - unconvert
    - bodyclose
  settings:
    govet:
      disable:
        - fieldalignment
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
      # Domain tests intentionally use Coolify's British spelling of statuses.
      - path: internal/domain/
        linters:
          - staticcheck
        text: "QF1001"

issues:
  max-same-issues: 10
